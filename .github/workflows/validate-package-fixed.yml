name: GBOTtel validation and source ZIP

on:
  push:
    branches:
      - chatgpt/reparacion-integral-2026-10-07-fixed

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exactly from lockfile
        run: npm ci --ignore-scripts

      - name: Project checks
        run: npm run check:project

      - name: Lint
        run: npm run lint

      - name: Package source
        run: |
          mkdir -p /tmp/gbottel-release
          tar             --exclude='./.git'             --exclude='./.github'             --exclude='./node_modules'             --exclude='./.expo'             --exclude='./android/.gradle'             --exclude='./android/app/build'             -czf /tmp/gbottel-release/gbottel-reparacion-integral-2026-10-07-fixed.tar.gz .
          cd /tmp/gbottel-release
          unzip -h >/dev/null 2>&1 || true

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gbottel-reparacion-integral-2026-10-07-fixed
          path: /tmp/gbottel-release/gbottel-reparacion-integral-2026-10-07-fixed.tar.gz
          if-no-files-found: error
